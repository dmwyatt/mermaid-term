[project]
name = "mermaid-term"
version = "0.1.0"
description = "Render Mermaid diagrams as Unicode box-drawing art in the terminal"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["mermaid", "diagram", "terminal", "ascii-art", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]
readme = "README.md"
authors = [
    { name = "Dustin Wyatt", email = "dustin.wyatt@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "wcwidth>=0.8.2",
]

[project.urls]
Repository = "https://github.com/dmwyatt/mermaid-term"
Issues = "https://github.com/dmwyatt/mermaid-term/issues"

[project.scripts]
mermaid-term = "mermaid_term.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
